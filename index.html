<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>KEEP THE LIGHT</title>
		<meta name="description" content="KEEP THE LIGHT - a tiny lighthouse-keeper climb. Gather the lost lens panes, mind the oil, and relight the lamp before the storm takes it.">
		<meta name="theme-color" content="#0a0f18">
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<style>html,body{background:#0a0f18}#status{background-color:#0a0f18}#status-progress{width:230px;height:5px;border-radius:3px;-webkit-appearance:none;appearance:none}#status-progress::-webkit-progress-bar{background:#1c2740;border-radius:3px}#status-progress::-webkit-progress-value{background:#e8a94c;border-radius:3px}#status-progress::-moz-progress-bar{background:#e8a94c;border-radius:3px}#status-splash{max-width:180px}#status-notice{background:#f3ecd9;border:1px solid #d8cba8;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,0.45);color:#2b2417;font-family:Georgia,'Times New Roman',serif;text-align:center;max-width:300px;line-height:1.5;padding:24px 26px;margin:0 16px}canvas{background:#0a0f18}</style>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":112192,"index.wasm":35376909},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
// Split-pack loader: the pck ships as base64 text parts (index.pck.b64.N) so it can
// deploy through text-only channels. fetch() for index.pck is answered from the
// reassembled bytes; when no parts exist (local dev), the real index.pck loads.
const PCK_PARTS = ['index.pck.b64.0', 'index.pck.b64.1', 'index.pck.b64.2', 'index.pck.b64.3'];
let pckPartsPromise = null;
function getPckParts() {
	if (pckPartsPromise) return pckPartsPromise;
	pckPartsPromise = Promise.all(PCK_PARTS.map((p) => window.__ktlRealFetch(p).then((r) => (r.ok ? r.text() : null)))).then((texts) => {
		if (texts.every((t) => t === null)) return null;
		if (texts.some((t) => t === null)) throw new Error('KEEP THE LIGHT: a pack part is missing');
		const bin = atob(texts.join('').replace(/\s+/g, ''));
		const bytes = new Uint8Array(bin.length);
		for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
		return bytes;
	});
	return pckPartsPromise;
}
window.__ktlRealFetch = window.fetch.bind(window);
window.fetch = function (url, opts) {
	const s = String(url);
	if (s.endsWith('index.pck') || s.includes('index.pck?')) {
		return getPckParts().then((bytes) => {
			if (bytes === null) return window.__ktlRealFetch(url, opts);
			return new Response(bytes, {'status': 200, 'headers': {'Content-Type': 'application/octet-stream'}});
		});
	}
	return window.__ktlRealFetch(url, opts);
};
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		const raw = (err instanceof Error) ? err.message : (typeof err === 'string' ? err : '');
		let friendly;
		if (raw.indexOf('pack part') !== -1 || raw.indexOf('KEEP THE LIGHT:') === 0) {
			friendly = 'A piece of the tower failed to arrive.\nCheck your connection and reload - the climb is worth it.';
		} else if (raw.indexOf('features required') !== -1 || raw.indexOf('WebGL') !== -1) {
			friendly = 'This browser cannot keep the light.\nThe tower needs WebGL2 - a current browser will have it.';
		} else {
			friendly = 'The lamp would not light this time.\nCheck your connection and reload.';
		}
		setStatusNotice(friendly);
		document.getElementById('status-splash').style.display = 'none';
		statusProgress.style.display = 'none';
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).catch((err) => {
				console.error('Error while registering service worker:', err);
			}).then(() => {
				window.location.reload();
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
